name: Deploy to Development

on:
  push:
    branches:
      - development

permissions:
  contents: read

env:
  DEPLOY_WEBHOOK: ${{ secrets.DEV_DEPLOY_WEBHOOK }}

jobs:
  deploy:
    name: Build & Deploy (Dev)
    runs-on: ubuntu-latest

    steps:
      - name: Skip if not configured
        if: env.DEPLOY_WEBHOOK == ''
        run: |
          echo "DEV_DEPLOY_WEBHOOK is not set — skipping deployment."
          exit 0

      - uses: actions/checkout@v4

      - name: Setup Node
        if: env.DEPLOY_WEBHOOK != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node deps
        if: env.DEPLOY_WEBHOOK != ''
        run: npm ci

      - name: Build assets
        if: env.DEPLOY_WEBHOOK != ''
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_ENV: production

      - name: Trigger Forge deploy webhook
        if: env.DEPLOY_WEBHOOK != ''
        run: curl --fail --silent -X POST "${{ secrets.DEV_DEPLOY_WEBHOOK }}"

      - name: Wait for Forge deploy to complete
        if: env.DEPLOY_WEBHOOK != ''
        run: sleep 30

      - name: Sync built assets into live release
        if: env.DEPLOY_WEBHOOK != ''
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_FORGE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            public/build/ \
            ${{ secrets.DEV_DEPLOY_USER }}@${{ secrets.DEV_DEPLOY_HOST }}:${{ secrets.DEV_DEPLOY_PATH }}/build/
