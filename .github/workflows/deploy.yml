name: Deploy to Production

on:
  push:
    branches:
      - production

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

jobs:
  # ── CI: test + build ─────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env and generate key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build assets
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run tests
        run: php -d memory_limit=512M vendor/bin/pest --no-coverage

  # ── Deploy via SSH ────────────────────────────────────────────────────────────
  # Only runs when the DEPLOY_HOST secret is configured.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Skip if not configured
        if: env.DEPLOY_HOST == ''
        run: |
          echo "DEPLOY_HOST is not set — skipping deployment."
          exit 0

      - uses: actions/checkout@v4

      - name: Setup PHP
        if: env.DEPLOY_HOST != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        if: env.DEPLOY_HOST != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node deps
        if: env.DEPLOY_HOST != ''
        run: npm ci

      - name: Install Composer deps (production, no dev)
        if: env.DEPLOY_HOST != ''
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Build assets
        if: env.DEPLOY_HOST != ''
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_ENV: production
          VITE_APP_ENV: production
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST }}
          VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME: https

      - name: Sync built assets to server
        if: env.DEPLOY_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: public/build
          target: ${{ secrets.DEPLOY_PATH }}/public

      - name: Deploy via SSH
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin production
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan queue:restart
            curl --fail --silent https://${{ secrets.DEPLOY_HOST }}/health || exit 1

      - name: Notify Sentry of release
        if: env.DEPLOY_HOST != '' && env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
